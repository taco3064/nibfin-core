name: Package Core
description: Build, verify, and upload the selected public Core source
inputs:
  source_commit:
    description: Core source selected by the caller
    required: true
outputs:
  archive_sha256:
    description: Verified package digest
    value: ${{ steps.package.outputs.archive_sha256 }}
  manifest_hash:
    description: Verified manifest digest
    value: ${{ steps.package.outputs.manifest_hash }}
  artifact_id:
    description: Uploaded package artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
  - name: Validate public source request
    shell: bash
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
    run: |
      test "$PUBLIC_REPOSITORY" = true
      [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
  - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    with:
      repository: taco3064/nibfin-core
      ref: ${{ inputs.source_commit }}
      persist-credentials: false
      path: core-package-source
  - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
    with:
      node-version-file: core-package-source/.node-version
      package-manager-cache: false
  - name: Build and verify public installation
    id: package
    shell: bash
    working-directory: core-package-source
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    run: node scripts/package-ci.mjs
  - name: Upload build output
    id: upload
    uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    with:
      name: nibfin-core-${{ inputs.source_commit }}
      path: core-package-source/distribution/*
      if-no-files-found: error
      retention-days: 7
      compression-level: 0
