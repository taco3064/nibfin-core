name: Prepare Core release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag matching package.json (for example v0.1.0)
        required: true
        type: string
      create_draft:
        description: Create an unpublished draft after verification; false only plans
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: nibfin-core-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'taco3064/nibfin-core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Package and test installed entry
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/package-ci.mjs
      - name: Plan or create unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: node scripts/release-ci.mjs
