name: Nibfin adopted stage
on:
  workflow_dispatch:
    inputs:
      issue-number: { required: true, type: string }
      stage: { required: true, type: string }
permissions:
  contents: read
  id-token: write
jobs:
  adopted-stage:
    uses: taco3064/nibfin-core/.github/workflows/stage.yml@ebcacf9f0d567582a45d73236801dd4cf32b6bd9
    with:
      issue_number: ${{ inputs.issue-number }}
      stage: ${{ inputs.stage }}
      member_id: '127829492'
