name: Dispatch adopted Issue wake

on:
  workflow_call:
    inputs:
      core_commit:
        description: Compatibility input for existing callers
        required: false
        type: string
    secrets:
      NIBFIN_WAKE_ADOPTION:
        required: false
      NIBFIN_WAKE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      member_id: ${{ steps.resolve.outputs.member_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Route the current Issue event
        id: resolve
        env:
          NIBFIN_CORE_COMMIT: ${{ job.workflow_sha }}
          NIBFIN_WAKE_ADOPTION: ${{ vars.NIBFIN_SHARED_RUNNER_POOL != 'true' && secrets.NIBFIN_WAKE_ADOPTION || '' }}
          NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
          NIBFIN_SHARED_RUNNER_POOL: ${{ vars.NIBFIN_SHARED_RUNNER_POOL }}
        run: node scripts/issue-ci.mjs

  dispatch:
    needs: resolve
    if: needs.resolve.outputs.issue_number != '' && vars.NIBFIN_SHARED_RUNNER_POOL != 'true'
    runs-on:
      - self-hosted
      - linux
      - '${{ format(''nibfin-user-{0}'', needs.resolve.outputs.member_id) }}'
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      # No target checkout or hosted credential reaches the trusted host.
      - name: Dispatch with the installed Core and persistent journal
        working-directory: /opt/nibfin/core
        env:
          NIBFIN_ISSUE: ${{ needs.resolve.outputs.issue_number }}
        shell: bash --noprofile --norc -e {0}
        run: |
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            /usr/bin/node /opt/nibfin/core/bin/nibfin-core.mjs \
            dispatch-event "$NIBFIN_ISSUE"
