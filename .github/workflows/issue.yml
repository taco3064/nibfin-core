name: Dispatch adopted Issue wake

on:
  workflow_call:
    inputs:
      core_commit:
        description: Exact Core commit also pinned by the adopted caller configuration
        required: true
        type: string
    secrets:
      NIBFIN_WAKE_ADOPTION:
        required: true
      NIBFIN_WAKE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      issue_number: ${{ steps.resolve.outputs.issue_number }}
      member_id: ${{ steps.resolve.outputs.member_id }}
    steps:
      - name: Check fixed Core reference
        env:
          CORE_COMMIT: ${{ inputs.core_commit }}
          WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
        # Inline trusted workflow code runs before checking out any selected
        # revision. The read token is not supplied to this step.
        run: |
          node --input-type=module <<'NODE'
          const text = process.env.WAKE_ADOPTION;
          if (!text || text.length > 262144) process.exit(1);
          const adopted = JSON.parse(text);
          if (!/^[a-f0-9]{40}$/.test(process.env.CORE_COMMIT) ||
              adopted.coreCommit !== process.env.CORE_COMMIT) process.exit(1);
          NODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: taco3064/nibfin-core
          ref: ${{ inputs.core_commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Resolve current native authority without dispatch
        id: resolve
        env:
          NIBFIN_CORE_COMMIT: ${{ inputs.core_commit }}
          NIBFIN_WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
          NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
        run: node scripts/issue-ci.mjs

  dispatch:
    needs: resolve
    if: needs.resolve.outputs.issue_number != ''
    runs-on:
      - self-hosted
      - linux
      - '${{ format(''nibfin-user-{0}'', needs.resolve.outputs.member_id) }}'
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      # No target checkout or hosted credential reaches the trusted host.
      - name: Dispatch with the installed Core and persistent journal
        working-directory: /opt/nibfin/core
        env:
          NIBFIN_ISSUE: ${{ needs.resolve.outputs.issue_number }}
        shell: bash --noprofile --norc -e {0}
        run: |
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            /usr/bin/node /opt/nibfin/core/bin/nibfin-core.mjs \
            dispatch-event "$NIBFIN_ISSUE"
