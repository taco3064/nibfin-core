name: Nibfin Issue wake
on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - reopened
      - closed
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-event-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  wake:
    uses: "taco3064/nibfin-core/.github/workflows/issue.yml@\
      dd10c3701b31a1a2c48eaba715804c25f687f427"
    with:
      core_commit: dd10c3701b31a1a2c48eaba715804c25f687f427
    secrets:
      NIBFIN_WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
      NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
