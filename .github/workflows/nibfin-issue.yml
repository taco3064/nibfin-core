name: Nibfin Issue wake
on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - reopened
      - closed
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-event-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  wake:
    uses: "taco3064/nibfin-core/.github/workflows/issue.yml@\
      1e58f14d609dd70a01c3a30f87350a34fbeeb1fe"
    with:
      core_commit: 1e58f14d609dd70a01c3a30f87350a34fbeeb1fe
    secrets:
      NIBFIN_WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
      NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
