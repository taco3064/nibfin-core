name: Nibfin Issue wake
on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - reopened
      - closed
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-event-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  wake:
    uses: "taco3064/nibfin-core/.github/workflows/issue.yml@\
      3cb3b83e5702497230240cae4021c98c1ce19430"
    with:
      core_commit: 3cb3b83e5702497230240cae4021c98c1ce19430
    secrets:
      NIBFIN_WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
      NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
