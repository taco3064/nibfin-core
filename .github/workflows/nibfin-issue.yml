name: Nibfin Issue wake
on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - reopened
      - closed
permissions:
  contents: read
  id-token: write
concurrency:
  group: nibfin-event-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  wake:
    uses: "taco3064/nibfin-core/.github/workflows/issue.yml@\
      3c76eeea847c9f22318ac1d015a4f1f9f23d05ec"
    with:
      core_commit: 3c76eeea847c9f22318ac1d015a4f1f9f23d05ec
    secrets:
      NIBFIN_WAKE_ADOPTION: ${{ secrets.NIBFIN_WAKE_ADOPTION }}
      NIBFIN_WAKE_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
