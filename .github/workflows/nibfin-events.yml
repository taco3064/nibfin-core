name: Nibfin · Events

# Reusable: turns one GitHub event of the calling repository into a route run of the
# execution repository's nibfin-shared-runner.yml. Events only wake an Issue; Core
# decides from GitHub state what runs. Callers: nibfin-issue.yml (see
# docs/nibfin-callers.md). Core's Action reads the event as data, never as shell.

on:
  workflow_call:
    secrets:
      token:
        description: The gh login token of the Nibfin account (repo, workflow)
        required: true

permissions: {}

jobs:
  wake:
    name: wake
    runs-on: ubuntu-24.04
    steps:
      # Core's wake (src/route/wake.ts): it reads the event from the runner's event
      # file, filters it, and dispatches a route run, or asks a person on failure.
      - name: Wake the Issue
        uses: taco3064/nibfin-core/action@main
        with:
          command: wake
          token: ${{ secrets.token }}
          execution-repo: ${{ vars.NIBFIN_EXECUTION_REPO }}
