name: Execute Core stage

on:
  workflow_call:
    inputs:
      issue_number:
        description: Issue already adopted by the trusted host
        required: true
        type: string
      stage:
        description: One Core stage; the host verifies its current authorization
        required: true
        type: string
      member_id:
        description: Routing hint only; native member and Runner identity must agree
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: Nibfin stage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # This installed launcher is the Linux backend, not a product-wide OS rule.
    runs-on: [self-hosted, linux, '${{ format(''nibfin-user-{0}'', inputs.member_id) }}']
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      # Never checkout or execute repository/event-selected code on this host.
      # The administrator-installed Core and its adopted pins are authoritative.
      - name: Execute installed Core
        working-directory: /opt/nibfin/core
        env:
          NIBFIN_ISSUE: ${{ inputs.issue_number }}
          NIBFIN_STAGE: ${{ inputs.stage }}
        shell: bash --noprofile --norc -e {0}
        run: |
          exec /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            /usr/bin/node /opt/nibfin/core/bin/nibfin-core.mjs \
            stage "$NIBFIN_ISSUE" "$NIBFIN_STAGE"
