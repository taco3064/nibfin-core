name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Pre-merge image evidence: build the amd64 image and smoke-test it.
      # Publishing happens only after merge, in image.yml.
      - if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v4
      - name: Build image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: nibfin:smoke
      - name: Smoke test image
        if: github.event_name == 'pull_request'
        run: sh .github/scripts/smoke-image.sh nibfin:smoke
