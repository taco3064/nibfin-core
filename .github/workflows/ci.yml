name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actionlint with its official download script; it runs shellcheck on run:
      # scripts and reads .github/actionlint.yaml.
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            latest "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The committed Action bundle must be what its sources build, as GitHub's
      # check-dist does; an extra or changed file under action/ fails.
      - name: Check the Action bundle
        run: |
          npm run bundle:action
          git diff --exit-code -- action/
          untracked=$(git status --porcelain --untracked-files=all -- action/)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "Run npm run bundle:action and commit action/" >&2
            exit 1
          fi
      # Pre-merge image evidence: build the amd64 image and smoke-test it.
      # Publishing happens only after merge, in image.yml.
      - if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v4
      - name: Build image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: nibfin:smoke
      - name: Smoke test image
        if: github.event_name == 'pull_request'
        run: sh .github/scripts/smoke-image.sh nibfin:smoke
