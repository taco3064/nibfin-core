name: CI

on:
  pull_request:
  push:
    branches: [main, 'bootstrap/**']

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the exact push comparison base
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        env:
          SOURCE_BEFORE: ${{ github.event.before }}
        run: git fetch --no-tags origin "$SOURCE_BEFORE"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run verify

  windows-source-cache:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node --test test/source-mode.test.mjs
      - name: Verify native Windows MCP process and source boundaries
        run: >-
          node --test test/mcp-source.test.mjs test/mcp-resolve.test.mjs
          test/mcp-windows.test.mjs
      - name: Diagnose Windows MCP preflight transport on failure
        if: always()
        run: node scripts/diagnose-windows-mcp.mjs

  package:
    uses: ./.github/workflows/package.yml
    with:
      source_commit: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
