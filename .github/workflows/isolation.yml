name: Remote isolation verification

on:
  push:
    branches: ['bootstrap/core-1-runtime']
    paths: ['src/**', 'scripts/verify-live-*.mjs', '.github/workflows/isolation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oidc-boundary:
    name: Real Actions identity boundary
    if: github.event_name == 'push' && github.repository == 'taco3064/nibfin-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify real signature and deny hosted or forged caller
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-live-actions-identity.mjs

  offline-hooks:
    name: Real offline hook isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # This is a disposable test VM, not a user installation prerequisite.
      - name: Prepare rootless Docker on the remote test VM
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update -qq
          sudo apt-get install -y uidmap dbus-user-session docker-ce docker-ce-cli containerd.io docker-ce-rootless-extras
          sudo systemctl disable --now docker.service docker.socket
          sudo rm -f /var/run/docker.sock
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dockerd-rootless-setuptool.sh install
          systemctl --user start docker
          echo "NIBFIN_TEST_DAEMON_READY=1" >> "$GITHUB_ENV"
          docker --host "unix://$XDG_RUNTIME_DIR/docker.sock" info
      - name: Resolve test image and run real negative controls
        shell: bash
        run: |
          set -euo pipefail
          socket="unix:///run/user/$(id -u)/docker.sock"
          docker --host "$socket" pull node:24.22.1-bookworm-slim
          export NIBFIN_TEST_IMAGE="$(docker --host "$socket" image inspect node:24.22.1-bookworm-slim --format '{{.Id}}')"
          node scripts/verify-live-hooks.mjs
      - name: Test actual Codex sandbox without login or inference
        shell: bash
        run: |
          set -euo pipefail
          socket="unix:///run/user/$(id -u)/docker.sock"
          context="$(mktemp -d)"
          trap 'rm -rf "$context"' EXIT
          sudo apparmor_parser -r src/security/codex-security.apparmor
          export NIBFIN_CODEX_TEST_SECCOMP="$PWD/src/security/seccomp.json"
          printf '%s\n' 'FROM node:24.22.1-bookworm-slim' 'RUN npm install --global @openai/codex@0.138.0' 'RUN mkdir -p /session /etc/codex' > "$context/Dockerfile"
          docker --host "$socket" build --iidfile "$context/image-id" "$context"
          export NIBFIN_CODEX_TEST_IMAGE="$(cat "$context/image-id")"
          node scripts/verify-live-codex.mjs
          node scripts/verify-live-adapter.mjs
      - name: Stop disposable test daemon
        if: always() && env.NIBFIN_TEST_DAEMON_READY == '1'
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user stop docker
