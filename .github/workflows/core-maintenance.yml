name: Core maintenance
run-name: >-
  Core maintenance · CD ${{ inputs.cd_run_id || github.event.workflow_run.id }}
  · artifact ${{ inputs.activation_artifact_id || 'selected by producer' }}

on:
  workflow_run:
    workflows: [Core CD]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cd_run_id:
        description: Successful Core CD run containing the selected activation
        required: true
        type: string
      activation_artifact_id:
        description: Activation artifact from that same successful Core CD run
        required: true
        type: string

permissions: {}

jobs:
  dispatch-maintenance:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'taco3064/nibfin-core' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Dispatch this completed CD target through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/core-maintenance-dispatch.mjs

  core-maintenance:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'taco3064/nibfin-core' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, nibfin-shared]
    concurrency:
      group: nibfin-core-maintenance
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
    steps:
      - name: Apply the selected Core update through the installed administrator
        shell: bash --noprofile --norc -e {0}
        env:
          NIBFIN_CD_RUN_ID: ${{ inputs.cd_run_id }}
          NIBFIN_ACTIVATION_ARTIFACT_ID: ${{ inputs.activation_artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I \
            /usr/local/libexec/nibfin/core-rollout/client.py \
            "$NIBFIN_CD_RUN_ID" "$NIBFIN_ACTIVATION_ARTIFACT_ID"
