name: Nibfin · Retry Transient Reads
on:
  workflow_run:
    workflows: [Nibfin shared Runner]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: nibfin-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Resume after a settled transient Runner failure
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.NIBFIN_WAKE_TOKEN }}
        run: node scripts/retry-shared-runner.mjs
