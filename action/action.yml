name: Nibfin
description: >-
  Core's steps for the Nibfin workflows that run where the Nibfin image is not
  available. Built from nibfin-core's src/action/; see src/action/README.md.
inputs:
  command:
    description: "What to run: job-failed, repository-dispatch, runner-request or wake"
    required: true
  token:
    description: >-
      The gh login token of the Nibfin account. A wake reads it only for an event
      that wakes an Issue (a review on a fork pull request gets no secret); a runner
      request only once the request passed its body checks.
    required: false
  repo:
    description: "job-failed: the Issue's repository, <owner>/<repo>"
    required: false
  issue:
    description: "job-failed: the Issue number"
    required: false
  stage:
    description: "job-failed: the stage of the Job that failed"
    required: false
  execution-repo:
    description: "wake: the execution repository, <owner>/<repo> (NIBFIN_EXECUTION_REPO)"
    required: false
  job-token:
    description: >-
      runner-request: the job's GITHUB_TOKEN, which reads the request and writes the
      answer as github-actions[bot]
    required: false
  repository:
    description: "repository-dispatch: the repository the event goes to, <owner>/<repo>"
    required: false
  event-type:
    description: "repository-dispatch: the event's type (event_type)"
    required: false
  payload:
    description: "repository-dispatch: the event's client_payload, a JSON object"
    required: false
runs:
  using: node24
  main: main.mjs
